<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Videira • Painel online</title><link rel="stylesheet" href="/panel.css"><script src="/panel.js" defer></script></head><body>
