<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administração | Videira</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body><main class="admin"><a href="/">← Voltar à loja</a><p class="eyebrow" style="margin-top:40px">VIDEIRA VINHOTECA</p><h1 style="font-size:46px">Seu catálogo.</h1><p id="status" role="status">Entre com sua conta de administrador.</p><form id="login"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button class="pill">Entrar</button></form><section id="panel" hidden><button id="logout" class="text-button">Sair</button><form id="settingsForm"><label>WhatsApp com código do país e DDD<input id="whatsapp" inputmode="tel" required placeholder="5545999056277"></label><button class="pill">Salvar contato</button></form><div id="adminList" class="admin-list"></div><form id="productForm"><h2>Cadastrar ou editar rótulo</h2><input type="hidden" id="productId"><div class="admin-grid"><label>Nome<input id="name" required maxlength="200"></label><label>País<input id="country" maxlength="100"></label><label>Uva<input id="grape" maxlength="200"></label><label>Bodega<input id="winery" maxlength="200"></label><label>Categoria<input id="category" list="categoryOptions" required maxlength="100"><datalist id="categoryOptions"><option value="Tinto"><option value="Branco"><option value="Rosé"><option value="Espumante"><option value="Fortificado"><option value="Outro"></datalist></label><label>Preço em reais (vazio = sob consulta)<input id="price" type="number" min="0" max="9999999999" step="0.01"></label></div><label>URL HTTPS da foto<input id="image_url" type="url" placeholder="https://..."></label><label>Descrição<textarea id="description" maxlength="5000"></textarea></label><label><input type="checkbox" id="active" checked> Publicado no catálogo</label><label><input type="checkbox" id="featured"> Destaque</label><button id="save" class="pill">Salvar produto</button><button id="reset" type="button" class="text-button">Novo produto</button></form></section></main></body></html>
